name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: maven
      
      - name: Build and run tests
        run: ./mvnw -B verify
      
      - uses: actions/upload-artifact@v7
        with:
          name: asset-inventory-war
          path: target/asset-inventory.war

  release:
    name: Publish Release
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: asset-inventory-war
      
      - name: Create Checksum
        run: sha256sum asset-inventory.war > asset-inventory.war.sha256

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Tag="build-${{ github.run_number }}"
          gh release create "$Tag" asset-inventory.war asset-inventory.war.sha256 \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "$Tag" \
            --notes "Automated build from commit ${{ github.sha }}"



