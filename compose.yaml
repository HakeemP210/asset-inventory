services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: inventory_app
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: asset_inventory
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory_app -d asset_inventory"]
      interval: 5s
      timeout: 3s
      retries: 10
  
  app:
    build: .
    environment:
      DB_HOST: db
      DB_NAME: asset_inventory
      DB_USER: inventory_app
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data: